{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Menu | Balance Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{width:100%;overflow-x:hidden;margin:0;padding:0}
body{background:#fff8f5;font-family:Arial,sans-serif}
.my-nav{width:100%;background:#fff;padding:10px 15px;box-shadow:0 3px 15px rgba(0,0,0,0.08);position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{color:#d94f70;font-size:20px;font-weight:bold;text-decoration:none;white-space:nowrap}
.nav-right{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}
.search-box{flex:1;max-width:250px}
.search-box input{width:100%;border:1px solid #ddd;border-radius:25px;padding:8px 14px;outline:none;font-size:13px}
.search-box input:focus{border-color:#d94f70;box-shadow:0 0 0 2px rgba(217,79,112,0.1)}
.cart-btn{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#d94f70;color:white;border-radius:50%;text-decoration:none;flex-shrink:0}
#cart-count{position:absolute;top:-5px;right:-4px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#222;color:white;border-radius:50%;font-size:10px;font-weight:bold}
.product-card{background:white;border-radius:18px;overflow:hidden;height:100%;box-shadow:0 5px 20px rgba(0,0,0,0.07)}
.product-card img{width:100%;height:210px;object-fit:cover;display:block}
.product-content{padding:14px}
.price{color:#d94f70;font-weight:bold;font-size:19px}
.add-btn{width:100%;border:none;background:#d94f70;color:white;padding:9px;border-radius:25px;font-weight:bold;margin-top:10px}
#toastBox{position:fixed;top:85px;left:0;width:100%;display:none;justify-content:center;z-index:99999;padding:0 10px}
#toastMsg{background:#d94f70;color:white;padding:9px 18px;border-radius:30px;font-size:13px;font-weight:bold;border:1px solid white;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
@media (max-width:768px){.product-card img{height:160px}.my-nav{padding:10px}.search-box{max-width:180px}}
</style>
</head>
<body>

<nav class="my-nav">
<a href="/" class="brand">🍨 BALANCE BITE</a>
<div class="nav-right">
<div class="search-box"><input type="text" id="searchInput" placeholder="Search ice-cream..." autocomplete="off"></div>
<a href="/" style="text-decoration:none;color:#444;font-weight:600;font-size:14px">Home</a>
<a href="{% url 'cart' %}" class="cart-btn"><i class="bi bi-bag-heart"></i><span id="cart-count">0</span></a>
</div>
</nav>

<div class="container py-4">
<h2 style="text-align:center;color:#d94f70;font-weight:bold">Our Menu 🍨</h2>
<div class="row g-3 mt-1" id="productList">

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Vanilla Dream</h6><div class="price">₹120</div><button class="add-btn" onclick="addToCart('Vanilla Dream',120,'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1576506295286-5cda18df43e7?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Strawberry Bliss</h6><div class="price">₹140</div><button class="add-btn" onclick="addToCart('Strawberry Bliss',140,'https://images.unsplash.com/photo-1576506295286-5cda18df43e7?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Chocolate Fudge</h6><div class="price">₹160</div><button class="add-btn" onclick="addToCart('Chocolate Fudge',160,'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1501443762994-82bd5dace89a?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Mango Delight</h6><div class="price">₹150</div><button class="add-btn" onclick="addToCart('Mango Delight',150,'https://images.unsplash.com/photo-1501443762994-82bd5dace89a?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Brownie Sundae</h6><div class="price">₹190</div><button class="add-btn" onclick="addToCart('Brownie Sundae',190,'https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Butterscotch</h6><div class="price">₹130</div><button class="add-btn" onclick="addToCart('Butterscotch',130,'https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1516559828984-fb3b99548b21?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Oreo Overload</h6><div class="price">₹180</div><button class="add-btn" onclick="addToCart('Oreo Overload',180,'https://images.unsplash.com/photo-1516559828984-fb3b99548b21?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Kulfi Magic</h6><div class="price">₹110</div><button class="add-btn" onclick="addToCart('Kulfi Magic',110,'https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1579954115545-a95591f28bfc?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>KitKat Shake</h6><div class="price">₹170</div><button class="add-btn" onclick="addToCart('KitKat Shake',170,'https://images.unsplash.com/photo-1579954115545-a95591f28bfc?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

<div class="col-6 col-md-4 product-item"><div class="product-card"><img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80"><div class="product-content"><h6>Black Forest</h6><div class="price">₹200</div><button class="add-btn" onclick="addToCart('Black Forest',200,'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80')">Add to Cart</button></div></div></div>

</div>
</div>

<div id="toastBox"><div id="toastMsg"></div></div>

<script>
function updateCartCount(){let cart=JSON.parse(localStorage.getItem("cart"))||[];let total=cart.reduce((s,i)=>s+Number(i.qty||0),0);document.getElementById("cart-count").innerText=total;}
function addToCart(name,price,img){let cart=JSON.parse(localStorage.getItem("cart"))||[];let f=cart.find(i=>i.name===name);if(f){f.qty++}else{cart.push({name,price,qty:1,img})}localStorage.setItem("cart",JSON.stringify(cart));updateCartCount();let box=document.getElementById("toastBox");let msg=document.getElementById("toastMsg");msg.innerText="✅ "+name+" added";box.style.display="flex";clearTimeout(window.t);window.t=setTimeout(()=>box.style.display="none",2500);}

// SEARCH LOGIC - Menu madhe
let searchInput=document.getElementById("searchInput");
if(searchInput){
  searchInput.addEventListener("input",function(e){
    let val=e.target.value.toLowerCase().trim();
    let items=document.querySelectorAll(".product-item");
    items.forEach(function(card){
      let text=card.innerText.toLowerCase();
      card.style.display=text.includes(val)?"":"none";
    });
  });
}
updateCartCount();
</script>
</body>
</html>
