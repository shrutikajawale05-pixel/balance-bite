<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Success - Balance Bite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#fff8e8;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:white;padding:50px 35px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;max-width:420px;width:92%}
.tick{width:80px;height:80px;background:#6b3e26;color:white;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:45px;margin:0 auto 20px}
.btn-home{background:#6b3e26;color:white;border:none;border-radius:12px;padding:12px 30px;font-weight:bold;text-decoration:none;display:inline-block;margin-top:20px;width:100%}
.btn-home:hover{background:#4d2b1c;color:white}
</style>
</head>
<body>

<div class="box">
<div class="tick">✓</div>
<h2 style="color:#6b3e26;font-weight:bold">Order Placed!</h2>
<p class="text-muted mt-2">Thank you! Your ice cream is on the way 🍨</p>

<div class="mt-4 p-3" style="background:#fff8e8;border-radius:15px">
<p class="mb-1 small">ORDER ID</p>
<h4 class="fw-bold" style="color:#6b3e26">#BB<span id="oid"></span></h4>
<p class="mb-0 small text-muted">Paid via: <span id="pmode"></span></p>
<p class="mb-0 small text-muted">Total: ₹<span id="ptotal"></span></p>
</div>

<a href="/" class="btn-home">Back to Home</a>
</div>

<script>
// Order ID random
document.getElementById('oid').innerText = Math.floor(100000 + Math.random()*900000);
document.getElementById('pmode').innerText = localStorage.getItem('pay_mode') || 'COD';
document.getElementById('ptotal').innerText = localStorage.getItem('cart_total') || '0';

// Cart clear
localStorage.removeItem('cart');
</script>

</body>
</html>
